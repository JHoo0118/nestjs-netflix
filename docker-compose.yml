services:
  db:
    image: postgres:16
    container_name: postgres-db
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
      POSTGRES_DB: netflix
    ports:
      - '6432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts:/docker-entrypoint-initdb.d
    networks:
      - postgres-network
    restart: always

volumes:
  postgres_data:

networks:
  postgres-network:
    driver: bridge
